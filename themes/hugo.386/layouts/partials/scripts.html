<script>
    // Mobile navbar toggle — replaces bootstrap-collapse.js
    (function () {
        function initNavbar() {
            var toggle = document.querySelector('[data-toggle="collapse"]');
            if (!toggle) return;
            var target = document.querySelector(toggle.getAttribute('data-target'));
            if (!target) return;
            toggle.addEventListener('click', function () {
                target.classList.toggle('in');
            });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initNavbar);
        } else {
            initNavbar();
        }
    }());

    document.getElementById('thisyear').textContent = new Date().getFullYear();
</script>

<script>
    var remark_config = {
        host: "https://rmcomm.petrovs.info",
        site_id: 'petrovs_blog',
        components: ['embed'],
        max_shown_comments: 10,
        theme: 'dark',
        locale: 'en',
        show_email_subscription: false
    };

    (function (c) {
        for (var i = 0; i < c.length; i++) {
            var d = document, s = d.createElement('script');
            s.src = remark_config.host + '/web/' + c[i] + '.js';
            s.defer = true;
            (d.head || d.body).appendChild(s);
        }
    })(remark_config.components || ['embed']);
</script>
